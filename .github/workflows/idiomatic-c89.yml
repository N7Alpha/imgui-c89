name: idiomatic C89

on:
  push:
  pull_request:

jobs:
  regenerate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build wget lsb-release software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
      - name: Regenerate idiomatic C89 distribution
        env:
          LLVM_PREFIX: /usr/lib/llvm-22
          CMAKE_PREFIX_PATH: /usr/lib/llvm-22
          CC: clang-22
          CXX: clang++-22
        run: make dist-idiomatic-c89
      - name: Verify checked-in generated sources
        run: git diff --exit-code -- dist/imgui-c89
